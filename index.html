<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ledgerline</title>
<style>
/* Same tokens as the /digest page (PAGE in api.py) so the two look like one app. */
:root { --bg:#fafaf9; --card:#fff; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4;
        --up:#15803d; --down:#b91c1c; --warn-bg:#fef3c7; --warn-fg:#92400e;
        --btn:#1c1917; --btn-fg:#fafaf9; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0c0a09; --card:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#292524;
          --up:#4ade80; --down:#f87171; --warn-bg:#422006; --warn-fg:#fcd34d;
          --btn:#f5f5f4; --btn-fg:#1c1917; } }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--fg);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:920px; margin:0 auto; padding:32px 16px 64px; }
header { display:flex; justify-content:space-between; align-items:baseline; gap:12px;
         flex-wrap:wrap; margin-bottom:24px; }
h1 { font-size:22px; margin:0 }
h2 { font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 }
section { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:18px 20px; margin-bottom:16px; overflow-x:auto }
.head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px }
table { width:100%; border-collapse:collapse; font-size:14px }
th { text-align:left; font-weight:500; color:var(--muted); border-bottom:1px solid var(--line); padding:6px 8px }
td { border-bottom:1px solid var(--line); padding:7px 8px; vertical-align:middle }
tr:last-child td { border-bottom:0 }
.right { text-align:right }
.muted { color:var(--muted) } .up { color:var(--up) } .down { color:var(--down) }
a { color:inherit }
nav a { margin-left:14px }
button { font:inherit; font-size:14px; padding:6px 14px; border-radius:7px; cursor:pointer;
         border:1px solid var(--btn); background:var(--btn); color:var(--btn-fg) }
button.ghost { background:transparent; color:var(--fg); border-color:var(--line) }
button.danger { background:transparent; color:var(--down); border-color:var(--line); padding:3px 10px }
button:disabled { opacity:.5; cursor:default }
.pill { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid currentColor }
.products { display:flex; flex-wrap:wrap; gap:8px 20px; margin:0 0 16px }
.products label { display:flex; align-items:center; gap:6px }
.msg { margin:12px 0 0; padding:10px 12px; border-radius:7px; font-size:14px }
.msg:empty { display:none }
.msg.err { background:var(--warn-bg); color:var(--warn-fg) }
.msg.ok { border:1px solid var(--line) }
.msg ul { margin:4px 0 0; padding-left:18px }
</style>
</head>
<body>
<main>
  <header>
    <h1>ledgerline</h1>
    <nav class="muted"><a href="/digest">Daily digest</a><a href="/digest.json">json</a></nav>
  </header>

  <section>
    <div class="head">
      <h2>Linked accounts</h2>
      <button id="sync" class="ghost">Sync now</button>
    </div>
    <div id="items"><p class="muted">Loading…</p></div>
    <div id="sync-msg" class="msg"></div>
  </section>

  <section>
    <div class="head"><h2>Link an account</h2></div>
    <p class="muted" style="margin-top:0">Pick what to pull from this institution. Not every bank
      supports every product.</p>
    <div class="products">
      <label><input type="checkbox" name="product" value="transactions" checked> Transactions</label>
      <label><input type="checkbox" name="product" value="liabilities"> Credit cards &amp; loans</label>
      <label><input type="checkbox" name="product" value="investments"> Investments</label>
    </div>
    <button id="link">Link account</button>
    <div id="link-msg" class="msg"></div>
  </section>
</main>

<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script>
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...children);
  return n;
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.detail || `${res.status} ${res.statusText}`);
  return data;
}

function show(id, text, kind = "ok") {
  const m = $(id);
  m.className = `msg ${kind}`;
  m.replaceChildren(...(typeof text === "string" ? [text] : text));
}

async function busy(button, fn) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = "Working…";
  try { await fn(); } finally { button.disabled = false; button.textContent = label; }
}

const STATUS = { ok: ["up", "ok"], needs_attention: ["down", "reconnect needed"], error: ["down", "error"] };

function when(ts) {
  if (!ts) return "never";
  const d = new Date(ts);
  return isNaN(d) ? ts : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
}

async function loadItems() {
  let items;
  try {
    items = await api("GET", "/items");
  } catch (e) {
    $("items").replaceChildren(el("p", { className: "down", textContent: `Couldn't load accounts: ${e.message}` }));
    return;
  }
  if (!items.length) {
    $("items").replaceChildren(el("p", { className: "muted", textContent: "Nothing linked yet. Link your first account below." }));
    return;
  }
  const rows = items.map((i) => {
    const [cls, text] = STATUS[i.status] || ["muted", i.status || "not synced"];
    const remove = el("button", { className: "danger", textContent: "Remove" });
    remove.onclick = () => {
      if (!confirm(`Remove ${i.institution || i.item_id}? This disconnects it at Plaid and deletes its local data.`)) return;
      busy(remove, async () => {
        try { await api("DELETE", `/items/${encodeURIComponent(i.item_id)}`); await loadItems(); }
        catch (e) { show("sync-msg", `Remove failed: ${e.message}`, "err"); }
      });
    };
    return el("tr", {},
      el("td", {}, el("b", { textContent: i.institution || i.item_id })),
      el("td", { className: "muted", textContent: i.products.join(", ") }),
      el("td", {}, el("span", { className: `pill ${cls}`, textContent: text })),
      el("td", { className: "muted", textContent: when(i.last_synced_at) }),
      el("td", { className: "right" }, remove));
  });
  const head = el("tr", {}, ...["Institution", "Products", "Status", "Last synced", ""].map((h) => el("th", { textContent: h })));
  $("items").replaceChildren(el("table", {}, el("thead", {}, head), el("tbody", {}, ...rows)));
}

$("sync").onclick = (ev) => busy(ev.target, async () => {
  try {
    const results = await api("POST", "/sync");
    const bad = results.filter((r) => r.status !== "ok");
    show("sync-msg", bad.length
      ? ["Some connections had problems:", el("ul", {}, ...bad.map((r) =>
          el("li", { textContent: `${r.institution || r.item_id}: ${Object.entries(r.steps)
            .filter(([, v]) => v !== "ok").map(([k, v]) => `${k} ${v}`).join(", ")}` })))]
      : `Synced ${results.length} connection${results.length === 1 ? "" : "s"}.`,
      bad.length ? "err" : "ok");
  } catch (e) {
    show("sync-msg", `Sync failed: ${e.message}`, "err");
  }
  await loadItems();
});

$("link").onclick = (ev) => busy(ev.target, async () => {
  const products = [...document.querySelectorAll("input[name=product]:checked")].map((c) => c.value);
  if (!products.length) return show("link-msg", "Pick at least one product.", "err");

  let link_token;
  try {
    const qs = new URLSearchParams(products.map((p) => ["products", p]));
    ({ link_token } = await api("POST", `/create_link_token?${qs}`));
  } catch (e) {
    return show("link-msg", `Couldn't start Plaid Link: ${e.message}`, "err");
  }

  Plaid.create({
    token: link_token,
    onSuccess: async (public_token, metadata) => {
      const name = metadata.institution?.name;
      try {
        await api("POST", "/exchange_public_token", { public_token, institution: name, products });
        show("link-msg", `Linked ${name || "account"}. The first sync is running in the background; refresh in a minute.`);
      } catch (e) {
        show("link-msg", `Linking failed: ${e.message}`, "err");
      }
      loadItems();
    },
    onExit: (err) => {
      if (err) show("link-msg", `Plaid Link closed: ${err.display_message || err.error_message || err.error_code}`, "err");
    },
  }).open();
});

loadItems();
</script>
</body>
</html>
