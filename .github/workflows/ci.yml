name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      # api creates data/ and secrets/ on import, which mcp_server then needs. No Plaid call is made.
      - name: Import smoke test
        env:
          PLAID_CLIENT_ID: ci
          PLAID_SECRET: ci
        run: uv run python -c "import db, metrics, sync, api, mcp_server"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ledgerline .
